# Publishes the website (index.html, the in-browser app and its images) to GitHub Pages.
# Runs only when started by hand (Actions tab > Pages > Run workflow), because Pages is not switched on for this repository yet
# and an automatic run on every push failed and sent an e-mail each time.
# To use it: repository Settings > Pages > Build and deployment > Source: "GitHub Actions", then run it from the Actions tab
# (to run it on every push again, add  push: branches: [main]  under on:).
name: Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          cp index.html _site/ && cp -r src assets _site/
          cp CHANGELOG.md README.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
